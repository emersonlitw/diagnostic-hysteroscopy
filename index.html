" aria-roledescription="分步圖解" aria-label="診斷式子宮鏡七個步驟。左右方向鍵切換步驟，空白鍵播放或暫停。"><svg xmlns="http://www.w3.org/2000/svg" class="iso-svg dh-fig" viewBox="0 0 600 400" role="img" aria-label="診斷式子宮鏡（軟式子宮鏡）的示意圖：子宮、子宮頸、兩側輸卵管與卵巢以冠狀切面（從正面）剖半，平放、切面朝上；子宮底在遠端，子宮頸靠近觀看者，切面上可看到倒三角形的子宮腔、一層內膜與窄縫狀的子宮頸管，兩側輸卵管從子宮角往外延伸到卵巢旁（卵巢為示意）。一支細軟的子宮鏡從靠近觀看者的一側沿子宮中軸經子宮頸外口進入子宮頸管與子宮腔，鏡身往觀看者方向延伸出畫面，以斷線符號縮短，前端約 12 mm 可以左右彎曲；第 1 步左下方有一個放大圈，顯示前端端面的鏡頭、出水口與兩個小光點。生理食鹽水以很淡的半透明灰色表示：從前端出水口流出、撐開並充滿子宮腔，並沿鏡子兩側從子宮頸外口流出。剖面圖右下方有一台站立的螢幕，同步顯示鏡頭看到的灰階畫面。7 個步驟（醫師的檢查順序）：1 準備：鏡子來到子宮頸外口，通過子宮頸管、剛過子宮頸內口，子宮頸管貼著鏡子撐開，外口開始有少量水流，螢幕是暗的；2 灌注子宮腔：鏡子停在子宮腔下段（遠距），食鹽水由前端往上充滿子宮腔，螢幕先維持暗，水充滿後才亮起來，遠距看到整個子宮腔與兩側輸卵管開口（全景，兩個開口靠近畫面中間）；3 子宮底：鏡子沿中軸往前到靠近子宮底（近距），前端不彎，螢幕上兩個開口移到靠近畫面邊緣、仍看得到，中間是子宮底內膜；4 一側輸卵管開口：鏡子一邊往前、前端一邊彎向畫面右側（病人左側）的子宮角，這一側的輸卵管開口移到螢幕中央；5 另一側輸卵管開口：前端一邊回正一邊退回近距，螢幕經過子宮底的畫面，再一邊往前一邊彎向畫面左側（病人右側），螢幕中央是另一側的開口；6 再次檢查子宮底：前端一邊回正一邊退回近距停下，螢幕再次看到子宮底，與第 3 步相同；7 收尾：鏡子沿中軸退回子宮腔下段（遠距）停下，螢幕再次看到全景，與第 2 步相同，接著鏡子沿中軸慢慢退出，螢幕上兩個開口往中間靠、變小；子宮腔的水整片變淡、從子宮頸流出，螢幕跟著變灰濛，過子宮頸內口後轉暗，鏡子離開後螢幕暗。"><desc>診斷式子宮鏡（軟式子宮鏡）互動圖解 v8（Diagnostic Hysteroscopy (Flexible Hysteroscopy), interactive figure）。作者：李日升醫師（Dr. EmersonLi）；© 2026 李日升醫師，CC BY-NC-ND 4.0。https://emersonlitw.github.io/diagnostic-hysteroscopy/</desc><metadata><rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:cc="http://creativecommons.org/ns#" xmlns:dcterms="http://purl.org/dc/terms/"><cc:Work rdf:about=""><dc:title>診斷式子宮鏡（軟式子宮鏡） v8</dc:title><dcterms:alternative xml:lang="en">Diagnostic Hysteroscopy (Flexible Hysteroscopy)</dcterms:alternative><dc:creator><cc:Agent><dc:title>李日升醫師（Dr. EmersonLi）</dc:title></cc:Agent></dc:creator><dc:source>https://emersonlitw.github.io/diagnostic-hysteroscopy/</dc:source><dc:rights>© 2026 李日升醫師（Dr. EmersonLi） CC BY-NC-ND 4.0</dc:rights><dc:date>2026</dc:date><dc:language>zh-Hant-TW</dc:language><dc:type rdf:resource="http://purl.org/dc/dcmitype/InteractiveResource"/><cc:license rdf:resource="https://creativecommons.org/licenses/by-n
